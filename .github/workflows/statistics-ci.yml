name: Statistics CI

on:
  push:
    branches: [main]
    paths:
      - statistics-service/**
      - .github/workflows/statistics-ci.yml
      - .github/workflows/statistics-deploy.yml
  pull_request:
    branches: [main]
    paths:
      - statistics-service/**
      - .github/workflows/statistics-ci.yml
      - .github/workflows/statistics-deploy.yml
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: statistics-service/pnpm-lock.yaml

      - name: Test Statistics API
        working-directory: statistics-service
        run: |
          pnpm install --frozen-lockfile
          pnpm test
