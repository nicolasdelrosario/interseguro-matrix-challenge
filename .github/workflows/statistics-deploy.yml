name: Deploy Statistics

on:
  push:
    tags:
      - statistics-v*

permissions:
  contents: read

env:
  RESOURCE_GROUP: matrix-challenge
  CONTAINER_APPS_ENVIRONMENT: matrix-challenge-env
  ACR_NAME: ${{ vars.ACR_NAME }}

jobs:
  ci:
    uses: ./.github/workflows/statistics-ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Read the release version
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^statistics-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a release tag like statistics-v1.0.0.'
            exit 1
          fi
          release_version="${GITHUB_REF_NAME#statistics-v}"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check the infrastructure
        run: |
          az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APPS_ENVIRONMENT" --output none
          az acr show --name "$ACR_NAME" --output none

      - name: Check that the image version is new
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          existing_repository=$(az acr repository list --name "$ACR_NAME" --query "[?@ == 'statistics']" --output tsv)
          if [[ "$existing_repository" == statistics ]]; then
            existing_version=$(az acr repository show-tags --name "$ACR_NAME" --repository statistics --query "[?@ == '$RELEASE_VERSION']" --output tsv)
            if [[ "$existing_version" == "$RELEASE_VERSION" ]]; then
              echo "::error::Image statistics:$RELEASE_VERSION already exists. Publish a new version."
              exit 1
            fi
          fi

      - name: Build and deploy Statistics API
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/statistics-service
          acrName: ${{ env.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}
          imageToBuild: ${{ env.ACR_NAME }}.azurecr.io/statistics:${{ steps.release.outputs.version }}
          containerAppName: statistics
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_APPS_ENVIRONMENT }}
          ingress: internal
          targetPort: '3000'
