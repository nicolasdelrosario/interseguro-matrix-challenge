openapi: 3.1.0
info:
  title: Matrix API
  version: 1.0.0
  description: Rotate a matrix or calculate its reduced QR factorization, with statistics over the result.
servers:
  - url: /api/v1
security: []
paths:
  /matrices/rotate:
    post:
      operationId: rotateMatrix
      summary: Rotate a matrix 90 degrees clockwise
      requestBody:
        $ref: '#/components/requestBodies/Matrix'
      responses:
        '200':
          description: Rotated matrix and its statistics
          content:
            application/json:
              schema:
                type: object
                required: [rotated, statistics]
                properties:
                  rotated:
                    $ref: '#/components/schemas/Matrix'
                  statistics:
                    $ref: '#/components/schemas/Statistics'
              example:
                rotated: [[4, 1], [5, 2], [6, 3]]
                statistics: { min: 1, max: 6, sum: 21, average: 3.5, hasDiagonalMatrix: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
  /matrices/qr:
    post:
      operationId: factorizeMatrix
      summary: Calculate reduced QR factorization
      description: For an m by n matrix, Q has m rows and k columns and R has k rows and n columns, where k is min(m,n). Floating point results are approximate.
      requestBody:
        $ref: '#/components/requestBodies/Matrix'
      responses:
        '200':
          description: Q, R, and statistics over both result matrices
          content:
            application/json:
              schema:
                type: object
                required: [q, r, statistics]
                properties:
                  q:
                    $ref: '#/components/schemas/Matrix'
                  r:
                    $ref: '#/components/schemas/Matrix'
                  statistics:
                    $ref: '#/components/schemas/Statistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  requestBodies:
    Matrix:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [matrix]
            properties:
              matrix:
                $ref: '#/components/schemas/Matrix'
          example:
            matrix: [[1, 2, 3], [4, 5, 6]]
  schemas:
    Matrix:
      type: array
      minItems: 1
      maxItems: 100
      description: Nonempty rectangular matrix of finite numbers with at most 100 rows and columns.
      items:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: number
    Statistics:
      type: object
      required: [min, max, sum, average, hasDiagonalMatrix]
      properties:
        min: { type: number }
        max: { type: number }
        sum: { type: number }
        average: { type: number }
        hasDiagonalMatrix:
          type: boolean
          description: True if any result matrix is square and all off-diagonal values are zero within a relative tolerance of 1e-9.
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Invalid matrix or numeric range
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request body exceeds 1 MiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Statistics service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
