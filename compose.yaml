services:
  matrix:
    build: ./matrix-service
    ports:
      - "8080:8080"
    environment:
      STATISTICS_URL: http://statistics:3000/api/v1/statistics
    depends_on:
      statistics:
        condition: service_healthy
  statistics:
    build: ./statistics-service
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
